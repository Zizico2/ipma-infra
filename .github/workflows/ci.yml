name: Validate portable deployment
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      - name: Validate locked Nix inputs
        run: nix flake check
      - name: Install JavaScript dependencies
        run: nix develop --command npm ci --ignore-scripts
      - name: Validate code, workflows and Terraform
        run: nix develop --command just verify
      - name: Fetch immutable service sources
        run: nix develop --command just sources
      - name: Build portable images
        run: nix develop --command just images
      - name: Start services
        run: nix develop --command just up
      - name: Native gRPC and cache smoke test
        run: nix develop --command just smoke
      - name: Container logs
        if: failure()
        run: nix develop --command npm run compose -- logs --tail 100
      - name: Stop test services
        if: always()
        run: nix develop --command just down
