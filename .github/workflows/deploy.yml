name: Deploy Cloud Run
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy (approval required after plan)
        required: true
        type: choice
        options: [staging, production]
permissions:
  contents: read
concurrency:
  group: cloud-run-${{ inputs.environment }}
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: "true"
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'europe-southwest1' }}
  DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      - name: Check configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GCP_PROJECT_ID"
          test -n "$TF_CLOUD_ORGANIZATION"
          test -n "$TF_TOKEN_app_terraform_io"
      - run: nix develop --command npm ci --ignore-scripts
      - run: nix develop --command just verify
      - run: nix develop --command just sources
      - run: nix develop --command just images
      - run: nix develop --command just up
      - run: nix develop --command just smoke
      - name: Stop local services
        if: always()
        run: nix develop --command just down
      - name: Authenticate build/plan identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
      - name: Authenticate registry
        run: nix develop --command gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
      - name: Publish tested images and create deployment plan
        run: nix develop --command npm run cloud-run:plan
      - name: Save exact plan for approval and application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-run-plan
          path: .artifacts/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  deploy:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      - run: nix develop --command npm ci --ignore-scripts
      - run: nix develop --command just sources
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-run-plan
          path: .artifacts/release/
      - name: Authenticate approved deployment identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Apply reviewed plan and check deployed services
        run: nix develop --command npm run cloud-run:apply
      - name: Save deployment endpoints and image provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-run-deployment
          path: |
            .artifacts/release/outputs.json
            .artifacts/release/deployment.json
          if-no-files-found: warn
          retention-days: 30
