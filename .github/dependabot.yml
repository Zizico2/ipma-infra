version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories:
      - /providers/cloud-run/app
      - /providers/cloud-run/bootstrap
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /containers
    schedule:
      interval: weekly
